name: Gate 0 Verified Patch Queue

on:
  push:
    branches:
      - production/gate-0-canonical-rules
    paths:
      - .gate0/patches/**
  pull_request:
    branches:
      - feature/auto-battler-alpha
    paths:
      - .gate0/patches/**

permissions:
  contents: write

concurrency:
  group: gate0-patch-queue
  cancel-in-progress: false

jobs:
  apply-test-push:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Gate 0 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production/gate-0-canonical-rules

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply queued task patch as one commit
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          queued=(.gate0/patches/*.patch .gate0/patches/*.patch.gz.b64)
          test "${#queued[@]}" -eq 1
          source_patch="${queued[0]}"
          apply_patch="$source_patch"
          if [[ "$source_patch" == *.patch.gz.b64 ]]; then
            base64 --decode "$source_patch" | gzip --decompress > /tmp/gate0-task.patch
            apply_patch=/tmp/gate0-task.patch
          fi
          git am --3way "$apply_patch"
          git rm "$source_patch"
          git commit --amend --no-edit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependency
        run: pnpm --filter @auto-battler/game-core build

      - name: Run TypeScript checks and tests
        run: pnpm run check

      - name: Verify whitespace
        run: git diff HEAD^ --check

      - name: Run Godot import and regression suite
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            barichello/godot-ci:4.7 \
            bash -lc '
              godot --headless --path client-godot --import
              for test in client-godot/test/*_test.gd; do
                godot --headless --path client-godot --script "res://test/$(basename "$test")"
              done
            '

      - name: Push verified task commit
        run: git push origin HEAD:production/gate-0-canonical-rules
