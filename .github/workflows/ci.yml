name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: git diff --check

  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: firebelley/setup-godot@v1.1.0
        with:
          godot-version: 4.7.1
      - name: Run Godot regression suite
        run: |
          for test in client-godot/test/*_test.gd; do
            godot --headless --path client-godot --script "res://test/$(basename "$test")" --quit
          done
